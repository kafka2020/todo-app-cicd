name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  # ===== Job 1: Сборка и тестирование =====
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Настройка JDK
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # Кэширование Maven-зависимостей (ускоряет повторные сборки)
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Сборка проекта
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # Запуск тестов
      - name: Run tests
        run: mvn test

      # Сохранение собранного JAR-файла как артефакта
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v3
        with:
          name: todo-app-jar
          path: target/*.jar

      # Уведомление о результате сборки
      - name: Build status notification
        if: always()
        run: echo "Build and test completed with status ${{ job.status }}"

  # ===== Job 2: Сборка и публикация Docker-образа =====
  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Вход в Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Сборка Docker-образа
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/todo-app:latest .

      # Отправка образа в Docker Hub
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/todo-app:latest

  # ===== Job 3: Деплой на виртуальную машину =====
  deploy:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # 1. Загружаем свежий образ
            docker pull ${{ secrets.DOCKER_USERNAME }}/todo-app:latest

            # 2. Останавливаем и удаляем старый контейнер (если есть)
            docker stop todo-app || true
            docker rm todo-app || true

            # 3. Запускаем новый контейнер
            docker run -d \
              --name todo-app \
              -p 8081:8080 \
              --restart unless-stopped \
              ${{ secrets.DOCKER_USERNAME }}/todo-app:latest

            # 4. Проверяем, что контейнер запустился
            sleep 5
            docker ps | grep todo-app
